name: Reproduce frozen research
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python run_research.py
      - run: python -m unittest discover -s studies/macro_foundations/tests -v
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: research-results
          retention-days: 7
          path: |
            outputs/
            figures/
            analysis_notebook.ipynb
